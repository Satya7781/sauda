services:
  - type: web
    name: sauda-backend
    env: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///sauda.db
      - key: ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: sauda-frontend
    env: static
    buildCommand: "npm install && npm run build:www"
    staticPublishPath: "./www"
