services:
  - type: web
    name: sauda-backend
    env: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./sauda.db
      - key: ALLOWED_ORIGINS
        value: "capacitor://localhost,ionic://localhost,http://localhost,https://localhost,http://127.0.0.1,https://127.0.0.1"

  - type: web
    name: sauda-frontend
    env: static
    buildCommand: "npm install && npm run build:www"
    staticPublishPath: "./www"
