<!DOCTYPE html>
<html>
<head>
  <title>API Config Test</title>
  <style>
    body { font-family: monospace; margin: 20px; background: #f0f0f0; }
    .box { background: white; padding: 15px; margin: 10px 0; border-radius: 5px; border-left: 4px solid #007bff; }
    .error { border-left-color: #dc3545; }
    .success { border-left-color: #28a745; }
    h2 { color: #333; }
  </style>
</head>
<body>
  <h1>Sauda API Configuration Diagnostic</h1>
  
  <script src="js/runtime-config.js"></script>
  <script src="js/api.js"></script>
  <script>
    function log(title, value, isError) {
      const box = document.createElement('div');
      box.className = 'box ' + (isError ? 'error' : 'success');
      box.innerHTML = '<strong>' + title + ':</strong><br><code>' + JSON.stringify(value, null, 2) + '</code>';
      document.body.appendChild(box);
    }
    
    window.addEventListener('DOMContentLoaded', async function() {
      log('Runtime Config Available', typeof window.getSaudaApiBaseUrl === 'function');
      log('Current API Base URL (from api.js)', API_BASE_URL);
      log('Via getter', window.getSaudaApiBaseUrl ? window.getSaudaApiBaseUrl() : 'N/A');
      log('__SAUDA_CONFIG__', window.__SAUDA_CONFIG__);
      
      // Try fetching categories
      try {
        const resp = await fetch(API_BASE_URL + '/categories');
        const data = await resp.json();
        log('Categories Fetch Success', 'Count: ' + (data.length || 0), false);
      } catch (e) {
        log('Categories Fetch Error', e.message, true);
      }
      
      // Try fetching sellers
      try {
        const resp = await fetch(API_BASE_URL + '/sellers');
        const data = await resp.json();
        log('Sellers Fetch Success', 'Count: ' + (data.length || 0), false);
      } catch (e) {
        log('Sellers Fetch Error', e.message, true);
      }
    });
  </script>
</body>
</html>
